<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnect - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f3f4f6; /* Equivalent to Tailwind's bg-gray-100 */
      color: #1f2937; /* Equivalent to Tailwind's text-gray-800 */
      text-align: center;
      padding: 20px;
    }
    .container {
      padding: 2rem;
      background-color: #ffffff; /* White */
      border-radius: 0.5rem; /* 8px */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.875rem; /* 30px, text-3xl */
      font-weight: 600; /* semibold */
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 1.5rem;
      color: #4b5563; /* text-gray-600 */
    }
    a {
      color: #3b82f6; /* text-blue-500 */
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You are Offline</h1>
    <p>It looks like you've lost your internet connection. Please check your network settings and try again.</p>
    <p>Some features may not be available while offline.</p>
    <a href="/">Try to Reload</a>
  </div>
</body>
</html>
